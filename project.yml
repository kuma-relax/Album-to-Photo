name: AlbumToPhoto
options:
  bundleIdPrefix: com.kumarelax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AlbumToPhoto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlbumToPhoto
        excludes:
          - "**/.DS_Store"
    resources:
      - AlbumToPhoto/Resources/Assets.xcassets
    info:
      path: AlbumToPhoto/Resources/Info.plist
      properties:
        CFBundleDisplayName: Album to Photo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "アルバムのページを撮影して写真を切り出すために使用します。"
        NSPhotoLibraryUsageDescription: "既存のアルバム写真を読み込んで切り出すために使用します。"
        NSPhotoLibraryAddUsageDescription: "切り出した写真を写真ライブラリへ保存するために使用します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumarelax.AlbumToPhoto
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AlbumToPhotoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlbumToPhotoTests
    dependencies:
      - target: AlbumToPhoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumarelax.AlbumToPhotoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlbumToPhoto:
    build:
      targets:
        AlbumToPhoto: all
        AlbumToPhotoTests: [test]
    test:
      targets:
        - AlbumToPhotoTests
    run:
      config: Debug
    archive:
      config: Release
